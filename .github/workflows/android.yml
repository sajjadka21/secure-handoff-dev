name: Android foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Configure Android NDK for Cargo
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the shared security core for Android ABIs
        run: cargo ndk -t arm64-v8a -t x86_64 --platform 26 -o apps/android/app/src/main/jniLibs build --release -p clipbridge-android-bridge
      - name: Test Rust JNI boundary
        run: cargo test -p clipbridge-android-bridge --locked
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          validate-wrappers: true
      - name: Android unit tests, lint and debug package
        run: gradle --no-daemon -p apps/android testDebugUnitTest lint assembleDebug
      - name: Android Keystore instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          script: gradle --no-daemon -p apps/android connectedDebugAndroidTest
