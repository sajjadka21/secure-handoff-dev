name: Format Android bridge source

on:
  push:
    paths:
      - crates/android-bridge/src/lib.rs
      - .github/workflows/format-bridge-source.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Format and export bridge source for the patch
        run: |
          cargo fmt --all
          echo ANDROID_BRIDGE_SOURCE_BEGIN
          base64 -w0 crates/android-bridge/src/lib.rs
          echo
          echo ANDROID_BRIDGE_SOURCE_END
