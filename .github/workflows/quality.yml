name: Rust quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Resolve desktop workspace dependencies before locked gates
        run: cargo check --workspace --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Secret Service integration (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus gnome-keyring
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="${RUNNER_TEMP}/clipbridge-keyring/data"
            mkdir -p "$XDG_DATA_HOME"
            eval "$(printf "\\n" | gnome-keyring-daemon --unlock --components=secrets)"
            cargo test -p clipcore linux::tests::secret_service_real_backend_round_trip_in_isolated_session -- --ignored
          '
      - name: Debug build
        run: cargo build --workspace --locked
      - name: Release build
        run: cargo build --workspace --locked --release

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Frontend tests
        run: npm test
      - name: Frontend typecheck and production build
        run: npm run build
      - name: Tauri desktop compile
        working-directory: .
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - name: Tauri desktop build
        working-directory: .
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-05
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Check fuzz source formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Bounded fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          for target in qr envelope pairing_control pairing_events; do
            cargo fuzz run "$target" -- -max_total_time=20
          done

  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Check dependency policy
        run: cargo deny check

  security-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --all --format json --spec-version 1.5 --target all --override-filename sbom
      - uses: actions/upload-artifact@v7
        with:
          name: phase2-cyclonedx-sbom
          path: '**/*sbom*.json'
          if-no-files-found: error
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
      - name: Install pinned Gitleaks CLI for full-history scan
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan all repository history with Gitleaks
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="--all" --redact --exit-code=2 --report-format=sarif --report-path=gitleaks-history.sarif .
      - uses: actions/upload-artifact@v7
        with:
          name: gitleaks-full-history
          path: gitleaks-history.sarif
          if-no-files-found: error

