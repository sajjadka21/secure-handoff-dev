[package]
name = "clipcore"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
blake3.workspace = true
snow.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
getrandom.workspace = true
cbor2.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
snow.workspace = true
blake3.workspace = true
proptest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
tokio = { version = "=1.48.0", features = ["rt", "time"] }

[[bin]]
name = "clipbridge"
path = "src/bin/clipbridge.rs"
