[package]
name = "clipcore-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.10"
clipcore = { path = "../crates/clipcore" }

[[bin]]
name = "qr"
path = "fuzz_targets/qr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_control"
path = "fuzz_targets/pairing_control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_events"
path = "fuzz_targets/pairing_events.rs"
test = false
doc = false
bench = false
